<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

.wl-root {
  --ink: #17130f;
  --ink-soft: #5a4d38;
  --paper: #ece2c6;
  --paper-dim: #ddcfa6;
  --paper-line: #c9b989;
  --marquee: #a62639;
  --marquee-dark: #7c1c2b;
  --gold: #c9a227;
  --teal: #235347;
  --teal-dark: #163a31;

  background: var(--ink);
  color: var(--ink);
  font-family: 'Space Mono', monospace;
  min-height: 100%;
  padding: 0;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
}

.wl-root * { box-sizing: border-box; }

/* ---------- Marquee header ---------- */
.wl-marquee {
  background: linear-gradient(180deg, #1e1811 0%, var(--ink) 100%);
  padding: 28px 24px 22px;
  text-align: center;
  position: relative;
  border-bottom: 4px solid var(--gold);
}
.wl-marquee::before, .wl-marquee::after {
  content: '';
  position: absolute;
  top: 10px; bottom: 10px;
  width: 1px;
  background: repeating-linear-gradient(180deg, var(--gold) 0 6px, transparent 6px 14px);
  opacity: 0.6;
}
.wl-marquee::before { left: 14px; }
.wl-marquee::after { right: 14px; }
.wl-title {
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 0.14em;
  font-size: clamp(28px, 6vw, 44px);
  color: var(--gold);
  margin: 0;
  text-shadow: 0 0 14px rgba(201,162,39,0.35);
}
.wl-subtitle {
  color: var(--paper-dim);
  font-size: 12px;
  letter-spacing: 0.08em;
  margin-top: 6px;
  text-transform: uppercase;
}

/* ---------- Signed-in chip ---------- */
.wl-signin-bar {
  background: var(--ink);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  border-bottom: 1px dashed #3a3225;
}
.wl-chip {
  background: var(--paper);
  color: var(--ink);
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.wl-chip button {
  background: none;
  border: none;
  color: var(--marquee-dark);
  font-family: inherit;
  font-size: 11px;
  text-decoration: underline;
  cursor: pointer;
  padding: 0;
}

/* ---------- Name gate ---------- */
.wl-gate {
  background: var(--paper);
  padding: 40px 24px;
  text-align: center;
}
.wl-gate p {
  color: var(--ink-soft);
  font-size: 13px;
  margin-bottom: 16px;
}
.wl-gate-form {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}
.wl-input {
  font-family: 'Space Mono', monospace;
  padding: 10px 12px;
  border: 2px solid var(--ink);
  background: #fff9ea;
  border-radius: 6px;
  font-size: 14px;
  min-width: 200px;
}
.wl-btn {
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 0.06em;
  background: var(--marquee);
  color: #fff9ea;
  border: none;
  padding: 10px 20px;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  transition: transform 0.1s ease, background 0.15s ease;
}
.wl-btn:hover { background: var(--marquee-dark); transform: translateY(-1px); }
.wl-btn:active { transform: translateY(0); }
.wl-btn.gold { background: var(--gold); color: var(--ink); }
.wl-btn.gold:hover { background: #b58f1e; }
.wl-btn.teal { background: var(--teal); color: #fff9ea; }
.wl-btn.teal:hover { background: var(--teal-dark); }
.wl-btn.ghost {
  background: transparent;
  color: var(--ink-soft);
  border: 1.5px solid var(--paper-line);
}
.wl-btn.ghost:hover { background: var(--paper-dim); }
.wl-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

/* ---------- Body ---------- */
.wl-body { background: var(--paper); padding: 20px 20px 8px; }

.wl-addbar {
  background: #fff9ea;
  border: 1.5px dashed var(--paper-line);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 18px;
}
.wl-addbar-title {
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 0.06em;
  color: var(--marquee);
  font-size: 18px;
  margin: 0 0 10px;
}
.wl-add-form {
  display: grid;
  grid-template-columns: 2fr 90px 1fr auto;
  gap: 8px;
}
@media (max-width: 560px) {
  .wl-add-form { grid-template-columns: 1fr 1fr; }
  .wl-add-form .wl-full { grid-column: 1 / -1; }
}
.wl-add-form input { width: 100%; }

/* ---------- Tabs ---------- */
.wl-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
}
.wl-tab {
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 0.06em;
  font-size: 15px;
  background: var(--paper-dim);
  color: var(--ink-soft);
  border: none;
  padding: 8px 16px;
  border-radius: 8px 8px 0 0;
  cursor: pointer;
}
.wl-tab.active {
  background: var(--ink);
  color: var(--gold);
}

/* ---------- Ticket card ---------- */
.wl-list { display: flex; flex-direction: column; gap: 16px; padding-bottom: 20px; }

.wl-ticket {
  display: grid;
  grid-template-columns: 1fr 130px;
  background: #fff9ea;
  border-radius: 10px;
  box-shadow: 0 3px 0 rgba(23,19,15,0.15), 0 6px 14px rgba(23,19,15,0.12);
  position: relative;
  overflow: hidden;
}
@media (max-width: 520px) {
  .wl-ticket { grid-template-columns: 1fr; }
  .wl-stub { flex-direction: row !important; border-top: 2px dashed var(--paper-line); border-left: none !important; }
}

.wl-main { padding: 14px 16px; position: relative; }
.wl-movie-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 0.03em;
  color: var(--ink);
  margin: 0;
  line-height: 1.15;
}
.wl-movie-year { color: var(--ink-soft); font-size: 13px; }
.wl-note { color: var(--ink-soft); font-size: 12px; margin-top: 6px; font-style: italic; }
.wl-meta { color: var(--ink-soft); font-size: 11px; margin-top: 8px; letter-spacing: 0.02em; }

.wl-stub {
  border-left: 2px dashed var(--paper-line);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 10px;
  background: repeating-linear-gradient(135deg, #fff9ea 0 10px, #f7edd0 10px 20px);
}
.wl-stub::before, .wl-stub::after {
  content: '';
  position: absolute;
  width: 16px; height: 16px;
  background: var(--paper);
  border-radius: 50%;
}
.wl-stub::before { top: -8px; left: calc(100% - 130px - 8px); }
.wl-stub::after { bottom: -8px; left: calc(100% - 130px - 8px); }
@media (max-width: 520px) { .wl-stub::before, .wl-stub::after { display: none; } }

.wl-stamp {
  position: absolute;
  top: 10px; right: 12px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 15px;
  letter-spacing: 0.12em;
  color: var(--teal);
  border: 3px solid var(--teal);
  padding: 3px 8px;
  border-radius: 6px;
  transform: rotate(-10deg);
  opacity: 0.85;
  mix-blend-mode: multiply;
}

.wl-stars { display: flex; gap: 2px; }
.wl-star {
  cursor: pointer;
  font-size: 20px;
  color: var(--paper-line);
  background: none;
  border: none;
  line-height: 1;
  padding: 0;
}
.wl-star.filled { color: var(--gold); }
.wl-star:disabled { cursor: default; }

.wl-avg { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--marquee); }
.wl-avg-label { font-size: 10px; color: var(--ink-soft); letter-spacing: 0.06em; }

.wl-ratings-list { font-size: 10.5px; color: var(--ink-soft); margin-top: 4px; text-align: center; line-height: 1.5; }

.wl-remove {
  background: none; border: none; color: var(--marquee-dark);
  font-size: 11px; text-decoration: underline; cursor: pointer;
  position: absolute; bottom: 10px; right: 14px; font-family: 'Space Mono', monospace;
}

.wl-empty {
  text-align: center;
  color: var(--ink-soft);
  padding: 40px 20px;
  font-size: 13px;
  border: 1.5px dashed var(--paper-line);
  border-radius: 10px;
}

.wl-footer {
  text-align: center;
  padding: 10px;
  font-size: 10.5px;
  color: var(--ink-soft);
  background: var(--paper);
}
.wl-footer button {
  background: none; border: none; color: var(--marquee-dark);
  text-decoration: underline; cursor: pointer; font-family: inherit; font-size: 10.5px;
}

.wl-toast {
  position: fixed;
  bottom: 14px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--gold);
  padding: 8px 16px; border-radius: 20px; font-size: 12px;
  opacity: 0; transition: opacity 0.25s ease;
  pointer-events: none; z-index: 50;
}
.wl-toast.show { opacity: 1; }
</style>

<div class="wl-root" id="wl-root">
  <div class="wl-marquee">
    <h1 class="wl-title">Couch Critics</h1>
    <div class="wl-subtitle">monthly film watchlist</div>
  </div>

  <div id="wl-signin-bar" class="wl-signin-bar" style="display:none;"></div>
  <div id="wl-gate" class="wl-gate" style="display:none;"></div>
  <div id="wl-app" class="wl-body" style="display:none;"></div>
  <div class="wl-footer" id="wl-footer" style="display:none;">
    Everyone who signs in sees the same shared list. Ratings belong to each account.
  </div>
</div>
<div class="wl-toast" id="wl-toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

  // The anon key is safe to use in browser code when Row Level Security (RLS)

    SUPABASE_URL,
    SUPABASE_ANON_KEY

<script>
(function() {
  let currentUser = null;
  let profile = null;
  let movies = [];
  let activeTab = 'queue';

  const gate = document.getElementById('wl-gate');
  const signinBar = document.getElementById('wl-signin-bar');
  const app = document.getElementById('wl-app');
  const footer = document.getElementById('wl-footer');
  const toastEl = document.getElementById('wl-toast');

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function escapeHtml(str) {
    return (str || '').replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[c]));
  }

  function friendlyError(error) {
    if (!error) return 'Something went wrong.';
    if (error.message && error.message.toLowerCase().includes('invalid login credentials')) {
      return 'Incorrect email or password.';
    }
    if (error.message && error.message.toLowerCase().includes('email not confirmed')) {
      return 'Check your email and confirm your account first.';
    }
    return error.message || 'Something went wrong.';
  }

  function renderGate(mode = 'login') {
    signinBar.style.display = 'none';
    footer.style.display = 'none';
    app.style.display = 'none';
    gate.style.display = 'block';

    const isSignup = mode === 'signup';

    gate.innerHTML = `
      <p>${isSignup
        ? 'Create your Couch Critics account.'
        : 'Sign in to see the shared movie list and ratings.'}</p>

      ${isSignup ? `
        <div class="wl-gate-form" style="margin-bottom:8px;">
          <input class="wl-input" id="wl-name-input" placeholder="Your first name" maxlength="24" />
        </div>
      ` : ''}

      <div class="wl-gate-form">
        <input class="wl-input" id="wl-email-input" type="email" placeholder="Email" autocomplete="email" />
        <input class="wl-input" id="wl-password-input" type="password" placeholder="Password" autocomplete="${isSignup ? 'new-password' : 'current-password'}" />
        <button class="wl-btn" id="wl-auth-submit">${isSignup ? 'Create account' : 'Take a seat'}</button>
      </div>

      <div style="margin-top:14px;font-size:11px;color:var(--ink-soft);">
        ${isSignup
          ? `Already have an account? <button id="wl-switch-login" style="background:none;border:none;text-decoration:underline;color:var(--marquee-dark);cursor:pointer;font-family:inherit;">Log in</button>`
          : `New here? <button id="wl-switch-signup" style="background:none;border:none;text-decoration:underline;color:var(--marquee-dark);cursor:pointer;font-family:inherit;">Create an account</button>`
        }
      </div>
    `;

    const email = document.getElementById('wl-email-input');
    const password = document.getElementById('wl-password-input');
    const name = document.getElementById('wl-name-input');
    const submit = document.getElementById('wl-auth-submit');

    const go = async () => {
      const emailVal = email.value.trim();
      const passwordVal = password.value;
      const nameVal = name ? name.value.trim() : '';

      if (!emailVal || !passwordVal || (isSignup && !nameVal)) {
        toast('Please fill out all fields.');
        return;
      }

      if (isSignup && passwordVal.length < 6) {
        toast('Password must be at least 6 characters.');
        return;
      }

      submit.disabled = true;

      try {
        if (isSignup) {
          const { data, error } = await sb.auth.signUp({
            email: emailVal,
            password: passwordVal
          });
          if (error) throw error;

          // If email confirmation is disabled, a session is returned immediately.
          if (data.session && data.user) {
            const { error: profileError } = await supabase
              .from('profiles')
              .insert({ id: data.user.id, name: nameVal });
            if (profileError && !profileError.message.toLowerCase().includes('duplicate')) {
              throw profileError;
            }
            toast('Account created!');
            await init();
          } else {
            // Store the name temporarily so it can be used after email confirmation/login.
            localStorage.setItem('couch-critics-pending-name', nameVal);
            gate.innerHTML = `
              <p><strong>Check your email.</strong></p>
              <p>We sent a confirmation link to ${escapeHtml(emailVal)}. After confirming, come back and log in.</p>
              <button class="wl-btn" id="wl-back-login">Back to login</button>
            `;
            document.getElementById('wl-back-login').onclick = () => renderGate('login');
          }
        } else {
          const { error } = await sb.auth.signInWithPassword({
            email: emailVal,
            password: passwordVal
          });
          if (error) throw error;
          await init();
        }
      } catch (error) {
        toast(friendlyError(error));
      } finally {
        submit.disabled = false;
      }
    };

    submit.addEventListener('click', go);
    [email, password, name].filter(Boolean).forEach(input => {
      input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    });

    if (isSignup) {
      document.getElementById('wl-switch-login').onclick = () => renderGate('login');
      name.focus();
    } else {
      document.getElementById('wl-switch-signup').onclick = () => renderGate('signup');
      email.focus();
    }
  }

  async function ensureProfile() {
    if (!currentUser) return null;

    let { data, error } = await supabase
      .from('profiles')
      .select('id, name')
      .eq('id', currentUser.id)
      .maybeSingle();

    if (error) throw error;

    if (!data) {
      const pendingName = localStorage.getItem('couch-critics-pending-name') || 
        (currentUser.user_metadata && currentUser.user_metadata.name) || 
        currentUser.email.split('@')[0];

      const { data: created, error: createError } = await supabase
        .from('profiles')
        .insert({ id: currentUser.id, name: pendingName })
        .select('id, name')
        .single();

      if (createError) throw createError;
      data = created;
      localStorage.removeItem('couch-critics-pending-name');
    }

    profile = data;
    return data;
  }

  async function loadMovies() {
    const { data: movieRows, error: movieError } = await supabase
      .from('movies')
      .select('id, title, year, notes, added_by, added_at, watched, watched_at')
      .order('added_at', { ascending: true });

    if (movieError) throw movieError;

    const { data: ratingRows, error: ratingError } = await supabase
      .from('ratings')
      .select('id, movie_id, user_id, rating, created_at');

    if (ratingError) throw ratingError;

    const userIds = [...new Set([
      ...(movieRows || []).map(m => m.added_by).filter(Boolean),
      ...(ratingRows || []).map(r => r.user_id).filter(Boolean)
    ])];

    let profiles = [];
    if (userIds.length) {
      const { data: profileRows, error: profileError } = await supabase
        .from('profiles')
        .select('id, name')
        .in('id', userIds);

      if (profileError) throw profileError;
      profiles = profileRows || [];
    }

    const profileMap = Object.fromEntries(profiles.map(p => [p.id, p.name]));

    movies = (movieRows || []).map(m => ({
      id: m.id,
      title: m.title,
      year: m.year || '',
      notes: m.notes || '',
      addedBy: profileMap[m.added_by] || 'Unknown',
      addedAt: m.added_at,
      watched: !!m.watched,
      watchedAt: m.watched_at,
      ratings: Object.fromEntries(
        (ratingRows || [])
          .filter(r => r.movie_id === m.id)
          .map(r => [r.user_id, { value: r.rating, name: profileMap[r.user_id] || 'Unknown' }])
      )
    }));
  }

  function renderSigninBar() {
    signinBar.style.display = 'flex';
    signinBar.innerHTML = `
      <span class="wl-chip">
        🎟️ ${escapeHtml(profile ? profile.name : currentUser.email)}
        <button id="wl-logout">Log out</button>
      </span>
    `;
    footer.style.display = 'block';

    document.getElementById('wl-logout').onclick = async () => {
      await sb.auth.signOut();
      currentUser = null;
      profile = null;
      movies = [];
      renderGate('login');
    };
  }

  function avgRating(movie) {
    const vals = Object.values(movie.ratings || {})
      .map(r => typeof r === 'number' ? r : r.value)
      .filter(v => v > 0);

    if (!vals.length) return null;
    return vals.reduce((a,b) => a+b, 0) / vals.length;
  }

  function starRow(movie, interactive) {
    const myRatingObj = movie.ratings && movie.ratings[currentUser.id];
    const myRating = myRatingObj ? (typeof myRatingObj === 'number' ? myRatingObj : myRatingObj.value) : 0;

    let html = '<div class="wl-stars">';
    for (let i = 1; i <= 5; i++) {
      const filled = i <= myRating ? 'filled' : '';
      html += `<button class="wl-star ${filled}" data-movie="${movie.id}" data-val="${i}" ${interactive ? '' : 'disabled'}>★</button>`;
    }
    html += '</div>';
    return html;
  }

  function ratingsBreakdown(movie) {
    const entries = Object.values(movie.ratings || {}).filter(r => {
      const value = typeof r === 'number' ? r : r.value;
      return value > 0;
    });

    if (!entries.length) return '';

    return '<div class="wl-ratings-list">' +
      entries.map(r => {
        const value = typeof r === 'number' ? r : r.value;
        const name = typeof r === 'number' ? 'Unknown' : r.name;
        return `${escapeHtml(name)}: ${value}★`;
      }).join('<br/>') +
      '</div>';
  }

  function movieCard(movie) {
    const avg = avgRating(movie);
    const addedDate = movie.addedAt
      ? new Date(movie.addedAt).toLocaleDateString(undefined, {month:'short', day:'numeric'})
      : '';
    const watchedDate = movie.watchedAt
      ? new Date(movie.watchedAt).toLocaleDateString(undefined, {month:'short', day:'numeric'})
      : '';

    let stubInner = '';

    if (!movie.watched) {
      stubInner = `<button class="wl-btn teal" data-action="watch" data-movie="${movie.id}" style="font-size:13px; padding:8px 12px;">Mark watched</button>`;
    } else {
      stubInner = `
        ${avg !== null ? `<div style="text-align:center;"><div class="wl-avg">${avg.toFixed(1)}★</div><div class="wl-avg-label">avg</div></div>` : ''}
        ${starRow(movie, true)}
        ${ratingsBreakdown(movie)}
      `;
    }

    return `
      <div class="wl-ticket">
        <div class="wl-main">
          ${movie.watched ? '<div class="wl-stamp">WATCHED</div>' : ''}
          <h3 class="wl-movie-title">${escapeHtml(movie.title)}${movie.year ? ` <span class="wl-movie-year">(${escapeHtml(movie.year)})</span>` : ''}</h3>
          ${movie.notes ? `<div class="wl-note">"${escapeHtml(movie.notes)}"</div>` : ''}
          <div class="wl-meta">Suggested by ${escapeHtml(movie.addedBy)} · ${addedDate}${movie.watched ? ` · watched ${watchedDate}` : ''}</div>
          <button class="wl-remove" data-action="remove" data-movie="${movie.id}">remove</button>
        </div>
        <div class="wl-stub">${stubInner}</div>
      </div>
    `;
  }

  function renderApp() {
    app.style.display = 'block';

    const queue = movies
      .filter(m => !m.watched)
      .sort((a,b) => new Date(a.addedAt || 0) - new Date(b.addedAt || 0));

    const watched = movies
      .filter(m => m.watched)
      .sort((a,b) => new Date(b.watchedAt || 0) - new Date(a.watchedAt || 0));

    const list = activeTab === 'queue' ? queue : watched;

    app.innerHTML = `
      <div class="wl-addbar">
        <div class="wl-addbar-title">Add a pick</div>
        <div class="wl-add-form">
          <input class="wl-input" id="wl-new-title" placeholder="Movie title" maxlength="120" />
          <input class="wl-input" id="wl-new-year" placeholder="Year" maxlength="4" />
          <input class="wl-input wl-full" id="wl-new-note" placeholder="Notes (optional)" maxlength="140" />
          <button class="wl-btn gold" id="wl-new-submit">Add to queue</button>
        </div>
      </div>

      <div class="wl-tabs">
        <button class="wl-tab ${activeTab==='queue'?'active':''}" data-tab="queue">Queue (${queue.length})</button>
        <button class="wl-tab ${activeTab==='watched'?'active':''}" data-tab="watched">Watched (${watched.length})</button>
      </div>

      <div class="wl-list">
        ${list.length
          ? list.map(movieCard).join('')
          : `<div class="wl-empty">${activeTab === 'queue'
              ? 'No movies queued yet — add the first one above.'
              : 'Nothing watched yet. Once you mark a movie watched, it lands here for rating.'}</div>`}
      </div>
    `;

    document.getElementById('wl-new-submit').onclick = addMovie;
    document.getElementById('wl-new-title').addEventListener('keydown', e => {
      if (e.key === 'Enter') addMovie();
    });

    app.querySelectorAll('.wl-tab').forEach(btn => {
      btn.onclick = () => {
        activeTab = btn.dataset.tab;
        renderApp();
      };
    });

    app.querySelectorAll('[data-action="watch"]').forEach(btn => {
      btn.onclick = () => markWatched(btn.dataset.movie);
    });

    app.querySelectorAll('[data-action="remove"]').forEach(btn => {
      btn.onclick = () => removeMovie(btn.dataset.movie);
    });

    app.querySelectorAll('.wl-star').forEach(btn => {
      btn.onclick = () => rateMovie(btn.dataset.movie, parseInt(btn.dataset.val, 10));
    });
  }

  async function addMovie() {
    const titleInput = document.getElementById('wl-new-title');
    const yearInput = document.getElementById('wl-new-year');
    const noteInput = document.getElementById('wl-new-note');

    const title = titleInput.value.trim();
    if (!title) {
      titleInput.focus();
      return;
    }

    const { data, error } = await supabase
      .from('movies')
      .insert({
        title,
        year: yearInput.value.trim() || null,
        notes: noteInput.value.trim() || null,
        added_by: currentUser.id,
        watched: false
      })
      .select('id, title, year, notes, added_by, added_at, watched, watched_at')
      .single();

    if (error) {
      toast(friendlyError(error));
      return;
    }

    await loadMovies();
    activeTab = 'queue';
    renderApp();
    toast('Added to the queue.');
  }

  async function markWatched(id) {
    const { error } = await supabase
      .from('movies')
      .update({
        watched: true,
        watched_at: new Date().toISOString()
      })
      .eq('id', id);

    if (error) {
      toast(friendlyError(error));
      return;
    }

    await loadMovies();
    activeTab = 'watched';
    renderApp();
    toast('Marked watched — go ahead and rate it.');
  }

  async function removeMovie(id) {
    if (!confirm('Remove this movie from Couch Critics?')) return;

    const { error } = await supabase
      .from('movies')
      .delete()
      .eq('id', id);

    if (error) {
      toast(friendlyError(error));
      return;
    }

    await loadMovies();
    renderApp();
    toast('Movie removed.');
  }

  async function rateMovie(movieId, val) {
    const existing = movies.find(m => m.id === movieId)?.ratings?.[currentUser.id];
    const existingValue = existing ? (typeof existing === 'number' ? existing : existing.value) : 0;

    if (existingValue === val) {
      const { error } = await supabase
        .from('ratings')
        .delete()
        .eq('movie_id', movieId)
        .eq('user_id', currentUser.id);

      if (error) {
        toast(friendlyError(error));
        return;
      }
    } else {
      const { error } = await supabase
        .from('ratings')
        .upsert({
          movie_id: movieId,
          user_id: currentUser.id,
          rating: val
        }, { onConflict: 'movie_id,user_id' });

      if (error) {
        toast(friendlyError(error));
        return;
      }
    }

    await loadMovies();
    renderApp();
  }

  async function init() {
    if (!sb) throw new Error('Supabase client failed to initialize.');
    const { data, error } = await sb.auth.getUser();

    if (error || !data.user) {
      currentUser = null;
      profile = null;
      renderGate('login');
      return;
    }

    currentUser = data.user;

    try {
      await ensureProfile();
      await loadMovies();
      gate.style.display = 'none';
      renderSigninBar();
      renderApp();
    } catch (error) {
      console.error(error);
      toast(friendlyError(error));
    }
  }

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') {
      currentUser = null;
      profile = null;
      movies = [];
      renderGate('login');
    }
  });

  init();
})();
</script>
